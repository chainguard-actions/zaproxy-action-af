name: Test ZAP AF basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check Docker availability
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "Docker not available, skipping ZAP scan test"
            echo "DOCKER_AVAILABLE=false" >> $GITHUB_ENV
          else
            echo "DOCKER_AVAILABLE=true" >> $GITHUB_ENV
          fi
      - id: action
        uses: .
        with:
          plan: tests/fixtures/minimal-plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
