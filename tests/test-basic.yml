name: Test ZAP AF basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          plan: tests/fixtures/af-plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
        continue-on-error: true

      - name: Assert action ran (step was executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should have run (either success or failure from ZAP/Docker)
          # We just verify it was executed, not skipped
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step executed with outcome ${{ steps.action.outcome }}"
