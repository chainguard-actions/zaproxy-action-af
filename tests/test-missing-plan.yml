name: Test ZAP AF scan with missing plan file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock docker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/sh' \
            '# Mock docker: intercept pull and run for ZAP testing' \
            'if [ "$1" = "pull" ]; then' \
            '  echo "Mock: docker pull $2 (skipped)"' \
            '  exit 0' \
            'fi' \
            'if [ "$1" = "run" ]; then' \
            '  WORKSPACE=""' \
            '  PLAN_ARG=""' \
            '  PREV=""' \
            '  for arg in "$@"; do' \
            '    if [ "$PREV" = "-v" ]; then' \
            '      case "$arg" in' \
            '        *:/zap/wrk/:rw) WORKSPACE="${arg%%:*}" ;;' \
            '      esac' \
            '    fi' \
            '    if [ "$PREV" = "-autorun" ]; then' \
            '      PLAN_ARG="$arg"' \
            '    fi' \
            '    PREV="$arg"' \
            '  done' \
            '  echo "Mock: docker run called, workspace=$WORKSPACE plan=$PLAN_ARG"' \
            '  if [ -n "$PLAN_ARG" ] && [ -n "$WORKSPACE" ]; then' \
            '    PLAN_FILE="${PLAN_ARG#/zap/wrk/}"' \
            '    FULL_PATH="$WORKSPACE/$PLAN_FILE"' \
            '    if [ ! -f "$FULL_PATH" ]; then' \
            '      echo "Mock: plan file not found at $FULL_PATH - simulating ZAP failure"' \
            '      exit 1' \
            '    fi' \
            '  fi' \
            '  echo "Mock: ZAP scan completed"' \
            '  exit 0' \
            'fi' \
            'echo "Mock: unknown docker command: $*"' \
            'exit 1' > "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          plan: nonexistent-plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
        continue-on-error: true

      - name: Assert action failed due to missing plan
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing plan, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when plan file is missing"
