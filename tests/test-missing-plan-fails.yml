name: Test ZAP AF fails on missing plan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          plan: nonexistent-plan-file.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
        continue-on-error: true

      - name: Assert action failed on missing plan
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail because ZAP cannot find the plan file
          # (or because Docker is unavailable in the test environment)
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with missing plan, got ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when plan file does not exist"
