name: Test ZAP AF with docker env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal ZAP AF plan
        run: |
          cat > "$GITHUB_WORKSPACE/af-plan.yaml" << 'EOF'
          ---
          env:
            contexts:
              - name: "Default Context"
                urls:
                  - "http://localhost"
            parameters:
              failOnError: false
              failOnWarning: false
              progressToStdout: true
          jobs:
            - type: passiveScan-config
              parameters:
                maxAlertsPerRule: 10
          EOF

      - id: action
        uses: .
        with:
          plan: af-plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          docker_env_vars: |
            ZAP_AUTH_HEADER=X-Custom-Auth
            ZAP_AUTH_HEADER_VALUE=test-token
        continue-on-error: true

      - name: Assert action ran with env vars
        run: |
          echo "Action step completed with docker_env_vars input"
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action step did not run at all"
            exit 1
          fi
          echo "PASS: action step ran with outcome: ${{ steps.action.outcome }}"
