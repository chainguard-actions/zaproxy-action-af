name: Test ZAP AF - Basic Invocation (expected failure with non-ZAP image)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal AF plan file
        run: |
          cat > "$GITHUB_WORKSPACE/af-plan.yaml" << 'EOF'
          env:
            contexts:
              - name: "Test Context"
                urls:
                  - "http://localhost"
          jobs:
            - type: passiveScan-config
              parameters:
                maxAlertsPerRule: 10
          EOF

      - name: Run ZAP AF action (expected to fail - alpine has no zap.sh)
        id: zap_action
        uses: .
        with:
          plan: af-plan.yaml
          docker_name: alpine:3.18
        continue-on-error: true

      - name: Assert action ran (failed as expected with non-ZAP image)
        run: |
          echo "outcome: ${{ steps.zap_action.outcome }}"
          # The action should fail because alpine does not have zap.sh
          # This confirms the action correctly invoked Docker and attempted to run ZAP
          if [ "${{ steps.zap_action.outcome }}" = "failure" ]; then
            echo "PASS: action correctly failed when zap.sh is not available in the image"
          else
            echo "FAIL: expected action to fail with non-ZAP image, but got: ${{ steps.zap_action.outcome }}"
            exit 1
          fi
