name: Test ZAP AF with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          plan: tests/fixtures/af-plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          docker_env_vars: |
            MY_CUSTOM_VAR=test_value
          cmd_options: '-silent'
        continue-on-error: true

      - name: Assert action ran with custom options
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should have run (either success or failure from ZAP/Docker)
          # We verify it was not skipped - inputs were accepted
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted custom options and executed with outcome ${{ steps.action.outcome }}"
