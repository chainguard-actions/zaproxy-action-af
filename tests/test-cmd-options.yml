name: Test ZAP AF scan with cmd_options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal ZAP Automation Framework plan file
        run: |
          cat > "$GITHUB_WORKSPACE/test-plan.yaml" << 'EOF'
          ---
          env:
            contexts:
              - name: "Test Context"
                urls:
                  - "http://localhost"
            parameters:
              failOnError: false
              failOnWarning: false
              progressToStdout: true
          jobs: []
          EOF

      - name: Run ZAP AF action with cmd_options (lightweight image)
        id: zap_scan
        uses: .
        with:
          plan: test-plan.yaml
          docker_name: 'alpine:3.18'
          cmd_options: '-config connection.timeoutInSecs=60'
        continue-on-error: true

      - name: Assert action ran with cmd_options (not a setup/input error)
        run: |
          echo "ZAP scan step outcome: ${{ steps.zap_scan.outcome }}"
          # The action should have attempted to run with the cmd_options.
          # It will fail because alpine doesn't have zap.sh, but that's expected.
          # We verify it was not skipped (which would indicate an input parsing error).
          if [ "${{ steps.zap_scan.outcome }}" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with cmd_options input"
