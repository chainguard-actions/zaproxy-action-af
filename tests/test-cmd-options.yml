name: Test ZAP AF with additional cmd options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          plan: tests/fixtures/minimal-plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: '-silent'
        continue-on-error: true
      - name: Assert action was invoked with cmd options
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with cmd_options (outcome: ${{ steps.action.outcome }})"
